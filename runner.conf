# ── Runner configuration ─────────────────────────────────────────────
# Paths are relative to the repo root (where runner.sh lives).

# Backend (cns-line-oa)
BACKEND_PORT="${PORT:-8080}"
BACKEND_HEALTH_URL="http://localhost:${BACKEND_PORT}/healthz"
BACKEND_READY_URL="http://localhost:${BACKEND_PORT}/readyz"
BACKEND_SMOKE_URL="${SMOKE_BASE_URL:-}"

# Python interpreter for clawframework
PYTHON_BIN="${PYTHON_BIN:-.venv/bin/python}"
CLAW_DIR="clawframework"

# Default LLM provider/prompt used by `runner claw:run`
CLAW_PROVIDER="${CLAW_PROVIDER:-groq}"
CLAW_PROMPT="${CLAW_PROMPT:-Reply with exactly the word: SUCCESS}"

# Deployment target (staging|production) for `deploy:check`
DEPLOY_ENV="${DEPLOY_ENV:-staging}"
