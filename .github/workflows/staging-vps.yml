# Staging deploy to amardhaka.io (Hostinger VPS).
# Out of scope: new npm packages, second LINE router, GraphQL LINE events,
# Mongo for users, admin-chain changes, other vhosts, committing VPS secrets.
# Server .env stays on the box. GitHub secret VPS_SSH_KEY is the SSH key only.
name: staging-vps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy amardhaka.io
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ secrets.VPS_SSH_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Rsync and recreate container
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash ./scripts/deploy-vps-staging.sh

      - name: Public health
        run: curl -fsS https://amardhaka.io/healthz
